<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日记列表</title>
    <style>
      :root {
        color-scheme: light dark;
        --diary-bg: var(--color-background-secondary, Canvas);
        --diary-card: var(--color-background-primary, Canvas);
        --diary-text: var(--color-text-primary, CanvasText);
        --diary-muted: var(--color-text-secondary, GrayText);
        --diary-border: var(--color-border-secondary, rgba(128, 128, 128, 0.25));
        --diary-accent: var(--color-text-info, #2563eb);
        --diary-danger: var(--color-text-danger, #b42318);
        --diary-danger-bg: var(--color-background-danger, rgba(180, 35, 24, 0.08));
        --diary-radius: var(--border-radius-md, 10px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--diary-text);
        font: 14px/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .head h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .count {
        color: var(--diary-muted);
        font-size: 12px;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--diary-border);
        border-radius: 14px;
        background: var(--diary-card);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--diary-accent);
        outline: none;
      }
      .card.deleting {
        border-color: var(--diary-danger);
        background: var(--diary-danger-bg);
        cursor: default;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding-right: 24px;
      }
      .date {
        font-weight: 600;
      }
      .meta {
        color: var(--diary-muted);
        font-size: 12px;
      }
      .snippet {
        color: var(--diary-text);
        opacity: 0.85;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: pre-wrap;
      }
      .full {
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px dashed var(--diary-border);
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* The row menu sits in the corner and only shows on hover/focus so the
         destructive action is never the default click target. */
      .toolbar {
        position: absolute;
        top: 6px;
        right: 6px;
        display: flex;
        gap: 2px;
        opacity: 0;
        transition: opacity 120ms ease;
      }
      .card:hover .toolbar,
      .card:focus-within .toolbar,
      .toolbar:focus-within {
        opacity: 1;
      }
      @media (hover: none) {
        .toolbar {
          opacity: 1;
        }
      }
      .icon-btn {
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--diary-muted);
        font: inherit;
        font-size: 14px;
        line-height: 22px;
        cursor: pointer;
      }
      .icon-btn:hover,
      .icon-btn:focus-visible {
        background: var(--diary-bg);
        color: var(--diary-text);
        outline: none;
      }
      .confirm {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px dashed var(--diary-border);
      }
      .confirm p {
        margin: 0;
        color: var(--diary-danger);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .confirm .actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        border: 1px solid var(--diary-border);
        background: var(--diary-card);
        color: var(--diary-text);
        border-radius: 999px;
        padding: 6px 14px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .btn.danger {
        border-color: var(--diary-danger);
        color: var(--diary-danger);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn:focus-visible {
        outline: 2px solid var(--diary-accent);
        outline-offset: 1px;
      }
      .state {
        color: var(--diary-muted);
        padding: 16px 0;
        text-align: center;
      }
      .error {
        color: var(--diary-danger);
      }
      .toast {
        color: var(--diary-muted);
        font-size: 12px;
        padding: 4px 0;
      }
      .toast.error {
        color: var(--diary-danger);
      }
      .files {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }
      .file {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border: 1px solid var(--diary-border);
        border-radius: 12px;
        background: var(--diary-bg);
      }
      .file-main {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
      }
      .file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 550;
      }
      .file-meta {
        color: var(--diary-muted);
        font-size: 11px;
      }
      .thumb {
        display: block;
        width: 52px;
        height: 52px;
        flex: none;
        object-fit: cover;
        border-radius: 8px;
        background: var(--diary-card);
      }
      .file-mark {
        display: grid;
        width: 52px;
        height: 52px;
        flex: none;
        place-items: center;
        border-radius: 8px;
        background: var(--diary-card);
        color: var(--diary-muted);
        font-size: 11px;
        font-weight: 600;
      }
      .file-actions {
        display: flex;
        flex: none;
        gap: 6px;
      }
      .file-actions .btn {
        min-width: 52px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
      }
      .excerpt {
        margin: 0;
        max-height: 96px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--diary-muted);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .upload {
        align-self: flex-start;
        margin-top: 8px;
      }
      .empty {
        color: var(--diary-muted);
        border: 1px dashed var(--diary-border);
        border-radius: var(--diary-radius);
        padding: 16px;
        text-align: center;
      }
      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }
      .pager button {
        border: 1px solid var(--diary-border);
        background: transparent;
        color: var(--diary-accent);
        border-radius: 8px;
        padding: 4px 12px;
        font: inherit;
        cursor: pointer;
      }
      .pager button:disabled {
        color: var(--diary-muted);
        cursor: default;
        opacity: 0.6;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="wrap" aria-live="polite">
      <div class="head">
        <h1 id="title">日记</h1>
        <span class="count" id="count"></span>
      </div>
      <div class="cards" id="cards"></div>
      <input type="file" id="picker" hidden />
      <div class="state" id="state">加载中…</div>
      <div class="toast" id="toast" hidden></div>
      <div class="pager" id="pager">
        <button type="button" id="prev">上一页</button>
        <span class="meta" id="page"></span>
        <button type="button" id="next">下一页</button>
      </div>
    </main>
    <script>
      /* BRIDGE */
    </script>
    <script>
      (function () {
        "use strict";

        var B = window.diaryBridge;
        var cards = document.getElementById("cards");
        var state = document.getElementById("state");
        var count = document.getElementById("count");
        var title = document.getElementById("title");
        var toast = document.getElementById("toast");
        var pager = document.getElementById("pager");
        var prev = document.getElementById("prev");
        var next = document.getElementById("next");
        var pageLabel = document.getElementById("page");

        var query = { diary_date_from: "", diary_date_to: "", page: 1, page_size: 20 };
        var data = null;
        var expanded = "";
        // deleting is the entry awaiting confirmation; busy is the entry whose
        // delete request is in flight. At most one card is in either state.
        var deleting = "";
        var busy = "";
        var uploading = "";
        var loading = false;
        var loads = B.sequence();
        var picker = document.getElementById("picker");
        var pickerEntry = "";
        var notes = {};
        // 8 MiB decoded. Base64 adds a third, and MCP tool arguments are JSON.
        var maxBytes = 8 * 1024 * 1024;
        // Pictures larger than this are scaled down before upload. The card
        // has no image library, so this uses the canvas the host already allows.
        var compressAt = 5 * 1024 * 1024;

        function noteOn(entryID, text, isError) {
          notes[entryID] = { text: text, error: !!isError };
          setToast(text, isError);
        }

        function setState(text, isError) {
          state.textContent = text || "";
          state.className = isError ? "state error" : "state";
          state.hidden = !text;
        }

        function setToast(text, isError) {
          toast.textContent = text || "";
          toast.className = isError ? "toast error" : "toast";
          toast.hidden = !text;
        }

        function readQuery(input) {
          var args = input || {};
          query.diary_date_from = args.diary_date_from || "";
          query.diary_date_to = args.diary_date_to || "";
          query.page = Number(args.page) > 0 ? Number(args.page) : 1;
          query.page_size = Number(args.page_size) > 0 ? Number(args.page_size) : 20;
          if (query.diary_date_from || query.diary_date_to) {
            title.textContent = "日记 · " + (query.diary_date_from || "…") + " ~ " + (query.diary_date_to || "…");
          }
        }

        function entryBits(entry) {
          var meta = entry.meta || {};
          var bits = [];
          if (meta.lunar) bits.push(meta.lunar);
          if (meta.weather) bits.push(meta.weather);
          if (entry.attachments && entry.attachments.length) bits.push(entry.attachments.length + " 个附件");
          if (entry.updated_at) {
            try {
              bits.push("更新 " + new Date(entry.updated_at).toLocaleDateString());
            } catch (e) {}
          }
          return bits;
        }

        function confirmNode(entry) {
          var box = B.el("div", "confirm");
          box.appendChild(
            B.el("p", null, "删除 " + B.formatDate(entry.diary_date) + " 的日记？删除后无法恢复。")
          );
          var actions = B.el("div", "actions");
          var del = B.el("button", "btn danger", busy === entry.entry_id ? "删除中…" : "删除");
          del.type = "button";
          del.disabled = busy === entry.entry_id;
          del.setAttribute("data-action", "delete");
          var cancel = B.el("button", "btn", "取消");
          cancel.type = "button";
          cancel.disabled = busy === entry.entry_id;
          cancel.setAttribute("data-action", "cancel");
          actions.appendChild(del);
          actions.appendChild(cancel);
          box.appendChild(actions);
          return box;
        }

        function renderCard(entry, index) {
          var isDeleting = deleting === entry.entry_id;
          var card = B.el("div", "card" + (isDeleting ? " deleting" : ""));
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");
          card.setAttribute("aria-expanded", String(expanded === entry.entry_id));
          card.setAttribute("data-entry-id", entry.entry_id);
          card.setAttribute("data-index", String(index));

          var row = B.el("div", "row");
          row.appendChild(B.el("span", "date", B.formatDate(entry.diary_date)));
          var bits = entryBits(entry);
          if (bits.length) row.appendChild(B.el("span", "meta", bits.join(" · ")));
          card.appendChild(row);

          var toolbar = B.el("div", "toolbar");
          var remove = B.el("button", "icon-btn", "✕");
          remove.type = "button";
          remove.title = "删除这篇日记";
          remove.setAttribute("aria-label", "删除 " + B.formatDate(entry.diary_date) + " 的日记");
          remove.setAttribute("data-action", "ask-delete");
          toolbar.appendChild(remove);
          card.appendChild(toolbar);

          if (isDeleting) {
            card.appendChild(confirmNode(entry));
          } else if (expanded === entry.entry_id) {
            card.appendChild(B.el("div", "full", entry.content || ""));
            card.appendChild(filesNode(entry));
            var upload = B.el("button", "btn upload", uploading === entry.entry_id ? "上传中…" : "添加图片或文件");
            upload.type = "button";
            upload.disabled = uploading === entry.entry_id || busy === entry.entry_id;
            upload.setAttribute("data-action", "upload");
            card.appendChild(upload);
            var note = notes[entry.entry_id];
            if (note) card.appendChild(B.el("span", note.error ? "toast error" : "toast", note.text));
            var hint = B.el("span", "meta", entry.revision ? "收起 · v" + entry.revision : "收起");
            hint.style.marginTop = "6px";
            card.appendChild(hint);
          } else {
            card.appendChild(B.el("div", "snippet", B.snippet(entry.content, 160) || "（空）"));
          }
          return card;
        }


        function fileLabel(file) {
          var name = String((file && file.name) || "");
          var dot = name.lastIndexOf(".");
          var ext = dot > 0 ? name.slice(dot + 1, dot + 5).toUpperCase() : "FILE";
          return ext || "FILE";
        }

        function fileSize(n) {
          n = Number(n) || 0;
          if (n < 1024) return n + " B";
          if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10 * 1024 ? 1 : 0) + " KB";
          return (n / (1024 * 1024)).toFixed(1) + " MB";
        }

        function filesNode(entry) {
          var box = B.el("div", "files");
          var files = entry.attachments || [];
          if (!files.length) {
            box.appendChild(B.el("span", "meta", "还没有附件。图片、文本和 PDF 都可以附在这篇日记上。"));
            return box;
          }
          files.forEach(function (file) {
            var item = B.el("div", "file");
            item.setAttribute("data-file-id", file.file_id);
            if (file.mime && file.mime.indexOf("image/") === 0 && file.preview) {
              var img = document.createElement("img");
              img.className = "thumb";
              img.alt = file.name || "图片";
              img.src = "data:image/jpeg;base64," + file.preview;
              item.appendChild(img);
            } else {
              var mark = B.el("span", "file-mark", fileLabel(file));
              item.appendChild(mark);
            }
            var main = B.el("div", "file-main");
            main.appendChild(B.el("span", "file-name", file.name || file.file_id));
            main.appendChild(B.el("span", "file-meta", fileSize(file.size)));
            item.appendChild(main);
            var row = item;
            var actions = B.el("div", "file-actions");
            var download = B.el("button", "btn", "下载");
            download.type = "button";
            download.setAttribute("data-action", "download-file");
            download.setAttribute("data-file-id", file.file_id);
            download.disabled = busy === entry.entry_id;
            var remove = B.el("button", "btn", "删除");
            remove.type = "button";
            remove.setAttribute("data-action", "remove-file");
            remove.setAttribute("data-file-id", file.file_id);
            remove.disabled = busy === entry.entry_id;
            actions.appendChild(download);
            actions.appendChild(remove);
            item.appendChild(actions);
            if (file.content && (!file.mime || file.mime.indexOf("image/") !== 0)) {
              item.appendChild(B.el("pre", "excerpt", file.content));
            }
            box.appendChild(item);
          });
          return box;
        }

        function isImage(file) {
          return !!(file && file.type && file.type.indexOf("image/") === 0 && file.type !== "image/svg+xml");
        }

        function jpegName(name) {
          var base = String(name || "photo").replace(/\.[^.]+$/, "");
          return base + ".jpg";
        }

        // fitImage draws the picture into a canvas no wider than maxEdge and
        // exports JPEG, lowering quality until the result is under the cap.
        function fitImage(file) {
          return new Promise(function (resolve, reject) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () {
              URL.revokeObjectURL(url);
              var edge = 2048;
              var quality = 0.8;
              function attempt() {
                var scale = Math.min(1, edge / Math.max(img.width, img.height));
                var canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round(img.width * scale));
                canvas.height = Math.max(1, Math.round(img.height * scale));
                var ctx = canvas.getContext("2d");
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(function (blob) {
                  if (!blob) {
                    reject(new Error("图片压缩失败"));
                    return;
                  }
                  var smallEnough = blob.size <= compressAt;
                  var gaveUp = edge <= 1024 && quality <= 0.5;
                  if (smallEnough || gaveUp) {
                    resolve(new File([blob], jpegName(file.name), { type: "image/jpeg" }));
                    return;
                  }
                  if (quality > 0.5) quality -= 0.15;
                  else { edge = Math.round(edge * 0.75); quality = 0.7; }
                  attempt();
                }, "image/jpeg", quality);
              }
              attempt();
            };
            img.onerror = function () {
              URL.revokeObjectURL(url);
              reject(new Error("无法读取这张图片"));
            };
            img.src = url;
          });
        }

        function prepareFile(file) {
          if (!isImage(file)) return Promise.resolve(file);
          // Always try for a JPEG under 5 MB. If this widget cannot decode the
          // picture, upload the original; the server converts it again.
          return fitImage(file).catch(function () { return file; });
        }

        function readFile(file) {
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () {
              var value = String(reader.result || "");
              var comma = value.indexOf(",");
              resolve({
                name: file.name || "file",
                mime: file.type || "application/octet-stream",
                content_base64: comma >= 0 ? value.slice(comma + 1) : value,
              });
            };
            reader.onerror = function () {
              reject(reader.error || new Error("读取文件失败"));
            };
            reader.readAsDataURL(file);
          });
        }

        function uploadFile(entry, file) {
          if (!file) return;
          if (!isImage(file) && file.size > maxBytes) {
            noteOn(entry.entry_id, "文件超过 8 MB，请换一个小一些的。", true);
            paint();
            return;
          }
          if (uploading) return;
          uploading = entry.entry_id;
          noteOn(entry.entry_id, isImage(file) && file.size > compressAt ? "正在压缩图片…" : "正在上传…");
          paint();
          prepareFile(file)
            .then(function (ready) {
              if (ready.size > maxBytes) {
                return Promise.reject(new Error("压缩后仍超过 8 MB，请换一张小一些的图片"));
              }
              return readFile(ready);
            })
            .then(function (encoded) {
              return window.diary
                .callTool("addDiaryAttachment", {
                  request_id: B.uuid(),
                  entry_id: entry.entry_id,
                  expected_revision: entry.revision,
                  name: encoded.name,
                  mime: encoded.mime,
                  content_base64: encoded.content_base64,
                })
                .then(B.unwrap)
                .then(function () {
                  return encoded;
                });
            })
            .then(function (encoded) {
              uploading = "";
              noteOn(entry.entry_id, "已添加 " + encoded.name);
              // Refresh is best-effort. The file is already stored, so a
              // failed reload must not replace the success note.
              return Promise.resolve(load(data ? data.page : 1))
                .then(function () {
                  return window.diary.updateModelContext(
                    [{ type: "text", text: "用户在日记列表里给 " + entry.diary_date + " 添加了文件 " + encoded.name + "（" + encoded.mime + "）。" }],
                    { entry_id: entry.entry_id, attached_file: encoded.name }
                  );
                })
                .catch(function () {
                  return null;
                });
            })
            .catch(function (err) {
              uploading = "";
              var code = err && err.code;
              var message = err && err.message ? err.message : String(err);
              if (code === 409) {
                noteOn(entry.entry_id, "这篇日记刚被改过，请再试一次。", true);
                return load(data ? data.page : 1);
              }
              noteOn(entry.entry_id, "上传失败：" + message, true);
              paint();
            });
        }

        function saveFile(name, mime, b64) {
          var binary = atob(b64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          var blob = new Blob([bytes], { type: mime || "application/octet-stream" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = name || "file";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        function downloadFile(entry, fileID) {
          var file = (entry.attachments || []).filter(function (f) { return f.file_id === fileID; })[0];
          if (!file || busy) return;
          busy = entry.entry_id;
          noteOn(entry.entry_id, "正在准备下载…");
          paint();
          window.diary
            .callTool("getDiaryAttachment", {
              request_id: B.uuid(),
              entry_id: entry.entry_id,
              file_id: fileID,
            })
            .then(B.unwrap)
            .then(function (payload) {
              busy = "";
              saveFile((payload && payload.name) || file.name, payload && payload.mime, payload && payload.content_base64);
              noteOn(entry.entry_id, "已开始下载 " + (file.name || "文件"));
              paint();
            })
            .catch(function (err) {
              busy = "";
              noteOn(entry.entry_id, "下载失败：" + (err && err.message ? err.message : String(err)), true);
              paint();
            });
        }

        function removeFile(entry, fileID, page) {
          if (busy) return;
          busy = entry.entry_id;
          paint();
          var file = (entry.attachments || []).filter(function (f) {
            return f.file_id === fileID;
          })[0];
          window.diary
            .callTool("removeDiaryAttachment", {
              request_id: B.uuid(),
              entry_id: entry.entry_id,
              file_id: fileID,
              expected_revision: entry.revision,
            })
            .then(B.unwrap)
            .then(function () {
              busy = "";
              setToast("已移除 " + ((file && file.name) || "文件") + "。");
              return load(page);
            })
            .catch(function (err) {
              busy = "";
              var code = err && err.code;
              if (code === 404) {
                setToast("这个文件已经不在了。", true);
                return load(page);
              }
              if (code === 409) setToast("这篇日记刚被改过，请展开后重试。", true);
              else setToast("移除失败：" + (err && err.message ? err.message : String(err)), true);
              paint();
            });
        }

        function paint() {
          cards.textContent = "";
          if (!data) return;
          var entries = data.entries || [];
          count.textContent = data.total ? "共 " + data.total + " 条" : "";
          if (!entries.length) {
            var empty = B.el("div", "empty", "这段时间还没有已提交的日记。");
            cards.appendChild(empty);
            pager.hidden = true;
            return;
          }
          entries.forEach(function (entry, index) {
            cards.appendChild(renderCard(entry, index));
          });

          var pages = Math.max(1, Math.ceil((data.total || 0) / (data.page_size || query.page_size)));
          var page = data.page || query.page;
          pager.hidden = pages <= 1;
          pageLabel.textContent = page + " / " + pages;
          prev.disabled = page <= 1 || loading;
          next.disabled = page >= pages || loading;
        }

        function forEachCard(fn) {
          var entries = (data && data.entries) || [];
          Array.prototype.forEach.call(cards.querySelectorAll(".card"), function (card) {
            var id = card.getAttribute("data-entry-id");
            for (var i = 0; i < entries.length; i++) {
              if (entries[i].entry_id === id) {
                fn(card, entries[i]);
                return;
              }
            }
          });
        }

        // update focuses the moved element and keeps its ARIA state in sync
        // without rebuilding the list, so hover and focus survive clicks.
        function update() {
          forEachCard(function (card, entry) {
            card.setAttribute("aria-expanded", String(expanded === entry.entry_id));
          });
          prev.disabled = (data ? data.page : query.page) <= 1 || loading;
        }

        function askDelete(entryID) {
          deleting = entryID;
          setToast("");
          paint();
          var target = cards.querySelector('[data-entry-id="' + cssEscape(entryID) + '"] [data-action="delete"]');
          if (target) target.focus();
        }

        function cssEscape(value) {
          if (window.CSS && CSS.escape) return CSS.escape(value);
          return String(value).replace(/["\\]/g, "\\$&");
        }

        function describeDelete(entry) {
          return "用户在弹出的日记列表界面中删除了 " + entry.diary_date + " 的日记（" + entry.entry_id + "）。";
        }

        function deleteEntry(entry, page) {
          if (busy) return;
          busy = entry.entry_id;
          update();
          var del = cards.querySelector('[data-entry-id="' + cssEscape(entry.entry_id) + '"] [data-action="delete"]');
          if (del) {
            del.disabled = true;
            del.textContent = "删除中…";
          }
          var cancel = cards.querySelector('[data-entry-id="' + cssEscape(entry.entry_id) + '"] [data-action="cancel"]');
          if (cancel) cancel.disabled = true;
          window.diary
            .callTool("deleteDiaryEntry", {
              request_id: B.uuid(),
              entry_id: entry.entry_id,
              expected_revision: entry.revision,
            })
            .then(B.unwrap)
            .then(function () {
              busy = "";
              deleting = "";
              setToast("已删除 " + B.formatDate(entry.diary_date) + " 的日记。");
              // Loading the current page replaces the deleted card and steps
              // back a page if it left this page empty.
              return load(page);
            })
            .catch(function (err) {
              busy = "";
              var code = err && err.code;
              if (code === 404) {
                // Already gone (deleted elsewhere): reconcile with the server.
                deleting = "";
                setToast("这篇日记已经不存在了。", true);
                return load(page);
              }
              // 409 or a transient failure: leave the confirmation open so the
              // user can retry, or cancel and refresh by hand.
              if (code === 409) {
                setToast("这篇日记在别处被修改过，请刷新后再删除。", true);
              } else {
                setToast("删除失败：" + (err && err.message ? err.message : String(err)), true);
              }
              paint();
              var retry = cards.querySelector('[data-entry-id="' + cssEscape(entry.entry_id) + '"] [data-action="delete"]');
              if (retry) retry.focus();
            })
            .then(function () {
              // Tell the model what changed so follow-up turns do not quote a
              // deleted entry. Hosts without support simply ignore it.
              return window.diary.updateModelContext(
                [{ type: "text", text: describeDelete(entry) }],
                { deleted_entry_ids: [entry.entry_id], diary_dates: [entry.diary_date] }
              );
            });
        }

        function load(page) {
          var stale = loads.next();
          loading = true;
          deleting = "";
          if (!data) setState("加载中…");
          paint();
          return window.diary
            .callTool("listDiaryEntries", {
              request_id: B.uuid(),
              diary_date_from: query.diary_date_from || undefined,
              diary_date_to: query.diary_date_to || undefined,
              page: page,
              page_size: query.page_size,
            })
            .then(B.unwrap)
            .then(function (result) {
              if (stale()) return;
              data = result || { entries: [], page: page, page_size: query.page_size, total: 0 };
              if (!data.entries.length && data.page > 1) {
                // The last item on the last page was deleted: step back.
                loads.cancel();
                return load(data.page - 1);
              }
              setState("");
              var focus = expanded;
              paint();
              if (focus) {
                var target = cards.querySelector('[data-entry-id="' + cssEscape(focus) + '"]');
                if (target && target.scrollIntoView) target.scrollIntoView({ block: "nearest" });
              }
            })
            .catch(function (err) {
              if (stale()) return;
              var code = err && err.code;
              if (code === 404) {
                // A deleted entry made the requested page disappear.
                loads.cancel();
                if (page > 1) {
                  load(1);
                  return;
                }
              }
              setState("加载失败：" + (err && err.message ? err.message : String(err)), true);
            })
            .finally(function () {
              if (stale()) return;
              loading = false;
              paint();
            });
        }

        function onCardClick(card, event) {
          var actor = event.target && event.target.closest ? event.target.closest("[data-action]") : event.target;
          var action = actor && actor.getAttribute ? actor.getAttribute("data-action") : "";
          var entryID = card.getAttribute("data-entry-id");
          var entry = (data.entries || []).filter(function (e) {
            return e.entry_id === entryID;
          })[0];
          if (!entry) return;

          if (action === "ask-delete") {
            event.stopPropagation();
            askDelete(entryID);
            return;
          }
          if (action === "upload") {
            event.stopPropagation();
            if (uploading) return;
            pickerEntry = entryID;
            picker.value = "";
            picker.click();
            return;
          }
          if (action === "remove-file") {
            event.stopPropagation();
            var fileID = event.target.getAttribute("data-file-id");
            if (fileID) removeFile(entry, fileID, data.page || 1);
            return;
          }
          if (action === "download-file") {
            event.stopPropagation();
            var downloadID = actor && actor.getAttribute ? actor.getAttribute("data-file-id") : "";
            if (downloadID) downloadFile(entry, downloadID);
            return;
          }
          if (deleting === entryID) {
            if (action === "cancel") {
              deleting = "";
              paint();
            } else if (action === "delete") {
              deleteEntry(entry, data.page || 1);
            }
            return;
          }
          expanded = expanded === entryID ? "" : entryID;
          paint();
          var again = cards.querySelector('[data-entry-id="' + cssEscape(entryID) + '"]');
          if (again) again.focus();
        }

        cards.addEventListener("click", function (event) {
          var card = event.target.closest ? event.target.closest(".card") : null;
          if (card) onCardClick(card, event);
        });
        cards.addEventListener("keydown", function (event) {
          var card = event.target.classList && event.target.classList.contains("card") ? event.target : null;
          if (!card) return;
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            onCardClick(card, event);
          } else if (event.key === "Escape" && deleting) {
            deleting = "";
            paint();
          }
        });

        picker.addEventListener("change", function () {
          var file = picker.files && picker.files[0];
          var entryID = pickerEntry;
          pickerEntry = "";
          if (!file || !entryID || !data) return;
          var entry = (data.entries || []).filter(function (e) {
            return e.entry_id === entryID;
          })[0];
          if (entry) uploadFile(entry, file);
        });

        prev.addEventListener("click", function () {
          if (loading) return;
          expanded = "";
          load(Math.max(1, (data ? data.page : query.page) - 1));
        });
        next.addEventListener("click", function () {
          if (loading) return;
          expanded = "";
          load((data ? data.page : query.page) + 1);
        });

        // Tool input only describes the query. It must not trigger a second
        // request: the host pushes the authoritative result right after, and a
        // late-arriving reload would overwrite it.
        window.diary.onInput(readQuery);

        window.diary.onResult(function (result) {
          loads.cancel();
          var payload = B.parseResult(result);
          if (payload && payload.cancelled) return;
          if (payload && payload.code !== undefined) {
            if (payload.code !== 0) {
              setState("加载失败：" + (payload.message || "未知错误"), true);
              return;
            }
            payload = payload.data;
          }
          // The render tool echoes the same shape as listDiaryEntries.
          if (payload && Array.isArray(payload.entries)) {
            data = payload;
            if (!data.page) data.page = query.page;
            if (!data.page_size) data.page_size = query.page_size;
            setState("");
            paint();
          } else if (!data) {
            load(query.page);
          }
        });

        // A widget may stay mounted across turns; if the host re-invokes the
        // render tool, the next result should win over any reload in flight.
        window.diary.onToolResult(function (result) {
          var payload = B.parseResult(result);
          if (!payload || payload.cancelled) return;
          if (payload.code !== undefined && payload.code !== 0) return;
          var body = payload.code !== undefined ? payload.data : payload;
          if (body && Array.isArray(body.entries)) {
            loads.cancel();
            loading = false;
            data = body;
            if (!data.page) data.page = query.page;
            if (!data.page_size) data.page_size = query.page_size;
            setState("");
            paint();
          }
        });

        // Fallback for hosts that mount the view without pushing the result.
        setTimeout(function () {
          if (!data) load(query.page);
        }, 1500);
      })();
    </script>
  </body>
</html>
