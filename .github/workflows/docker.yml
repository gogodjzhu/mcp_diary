# Builds and pushes the Docker image to Docker Hub when a tag is pushed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - Docker Hub user name
#   DOCKERHUB_TOKEN    - Docker Hub access token (Account Settings -> Security)
#
# Trigger:  git tag v1.2.3 && git push origin v1.2.3
# Publishes: gogodjzhu/mcp-diary:1.2.3, :1.2, :latest

name: docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: gogodjzhu/mcp-diary

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Injects the tag into the binary (same as `make docker-build`).
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
